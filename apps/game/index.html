<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Tito Game - Aventura de plataformas en 5 mundos" />
    <link rel="icon" type="image/png" href="/assets/branding/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/branding/icon-180.png" />
    <title>Tito Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        /* dvh sigue a la barra de direcciones del movil; % es el respaldo. */
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #0d1117;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      canvas {
        display: block;
        image-rendering: auto;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #1b2a4a 0%, #0d1117 70%);
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #boot-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-logo {
        width: 220px;
        height: auto;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6));
      }
      #boot-title {
        font-size: 34px;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffd54f, #ff8f00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-sub {
        font-size: 14px;
        opacity: 0.7;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ffd54f;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        padding: 24px;
        background: #0d1117;
      }
      #rotate-hint .phone {
        width: 58px;
        height: 96px;
        border: 4px solid #ffd54f;
        border-radius: 12px;
        animation: tilt 1.6s ease-in-out infinite;
      }
      #rotate-hint p {
        font-size: 17px;
        letter-spacing: 1px;
        opacity: 0.85;
      }
      @keyframes tilt {
        0%,
        40% {
          transform: rotate(0deg);
        }
        70%,
        100% {
          transform: rotate(90deg);
        }
      }
      /* Solo en dispositivos tactiles en vertical: el juego es 16:9 horizontal. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="boot-screen">
      <img id="boot-logo" src="/assets/branding/logo.png" alt="Tito Game" onerror="this.style.display='none'" />
      <div id="boot-title">Tito Game</div>
      <div class="spinner"></div>
      <div id="boot-sub">Cargando aventura...</div>
    </div>
    <div id="rotate-hint">
      <div class="phone"></div>
      <p>Gira tu dispositivo para jugar</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
