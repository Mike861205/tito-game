<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="description" content="Tito Game - Aventura de plataformas en 5 mundos" />
    <link rel="icon" type="image/png" href="/assets/branding/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/branding/icon-180.png" />
    <title>Tito Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        /* dvh sigue a la barra de direcciones del movil; % es el respaldo. */
        height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        background: #0d1117;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        color: #fff;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      #game-root {
        position: fixed;
        inset: 0;
        width: 100dvw;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game-root canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        image-rendering: auto;
        outline: none;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #1b2a4a 0%, #0d1117 70%);
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #boot-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-logo {
        width: 220px;
        height: auto;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.6));
      }
      #boot-title {
        font-size: 34px;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ffd54f, #ff8f00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-sub {
        font-size: 14px;
        opacity: 0.7;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: #ffd54f;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        text-align: center;
        padding: 24px;
        background: #0d1117;
      }
      #rotate-hint .phone {
        width: 58px;
        height: 96px;
        border: 4px solid #ffd54f;
        border-radius: 12px;
        animation: tilt 1.6s ease-in-out infinite;
      }
      #rotate-hint p {
        font-size: 17px;
        letter-spacing: 1px;
        opacity: 0.85;
      }
      #rotate-hint button,
      #fullscreen-button {
        border: 1px solid rgba(255, 213, 79, 0.75);
        border-radius: 999px;
        background: rgba(31, 111, 235, 0.92);
        color: #fff;
        min-height: 44px;
        padding: 0 20px;
        font: 800 13px/1 'Segoe UI', sans-serif;
        letter-spacing: 0.6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      #fullscreen-button {
        display: none;
        position: fixed;
        right: calc(12px + env(safe-area-inset-right));
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 18;
      }
      #mobile-controls {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .touch-cluster {
        position: absolute;
        bottom: calc(12px + env(safe-area-inset-bottom));
        display: flex;
        align-items: flex-end;
        gap: clamp(8px, 1.5vw, 14px);
      }
      .touch-cluster.move {
        left: calc(14px + env(safe-area-inset-left));
      }
      .touch-cluster.actions {
        right: calc(14px + env(safe-area-inset-right));
      }
      .touch-button {
        pointer-events: auto;
        width: clamp(58px, 9.5vw, 78px);
        height: clamp(58px, 9.5vw, 78px);
        border: 2px solid rgba(255, 255, 255, 0.82);
        border-radius: 50%;
        background: linear-gradient(145deg, rgba(22, 36, 64, 0.88), rgba(8, 15, 28, 0.76));
        color: #fff;
        font: 900 clamp(21px, 3.5vw, 30px)/1 'Segoe UI', sans-serif;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.42), 0 0 18px rgba(69, 154, 255, 0.2);
        touch-action: none;
      }
      .touch-button small {
        display: block;
        margin-top: 3px;
        font-size: clamp(7px, 1.25vw, 10px);
        letter-spacing: 0.4px;
      }
      .touch-button.primary {
        width: clamp(68px, 11vw, 88px);
        height: clamp(68px, 11vw, 88px);
        border-color: #ffd54f;
        background: linear-gradient(145deg, rgba(35, 94, 210, 0.96), rgba(16, 52, 126, 0.9));
      }
      .touch-button.utility {
        width: clamp(50px, 7.5vw, 64px);
        height: clamp(50px, 7.5vw, 64px);
        font-size: clamp(15px, 2.5vw, 21px);
      }
      .touch-button.pressed,
      .touch-button:active {
        transform: translateY(4px) scale(0.96);
        background: linear-gradient(145deg, rgba(70, 149, 255, 0.98), rgba(25, 72, 165, 0.96));
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45), 0 0 22px rgba(90, 175, 255, 0.5);
      }
      .touch-joystick {
        pointer-events: auto;
        position: relative;
        width: clamp(116px, 18vw, 148px);
        height: clamp(116px, 18vw, 148px);
        border: 2px solid rgba(165, 205, 255, 0.72);
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, rgba(51, 116, 210, 0.16) 0 29%, transparent 30%),
          radial-gradient(circle at 50% 50%, rgba(10, 20, 39, 0.78) 0 63%, rgba(20, 40, 72, 0.72) 64% 100%);
        box-shadow: inset 0 0 24px rgba(76, 157, 255, 0.16), 0 8px 25px rgba(0, 0, 0, 0.38);
        touch-action: none;
      }
      .touch-joystick::before {
        content: '';
        position: absolute;
        inset: 17%;
        border: 1px solid rgba(150, 201, 255, 0.18);
        border-radius: 50%;
      }
      .joystick-guide {
        position: absolute;
        color: rgba(221, 238, 255, 0.62);
        font: 900 clamp(17px, 2.7vw, 23px)/1 'Segoe UI', sans-serif;
      }
      .joystick-guide.left { left: 9px; top: 50%; transform: translateY(-50%); }
      .joystick-guide.right { right: 9px; top: 50%; transform: translateY(-50%); }
      .joystick-guide.down { left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 15px; }
      #touch-joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 43%;
        height: 43%;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        background: linear-gradient(145deg, #397de4, #173668);
        box-shadow: 0 7px 13px rgba(0, 0, 0, 0.44), inset 0 2px 5px rgba(255, 255, 255, 0.24);
        transform: translate(-50%, -50%);
        will-change: transform;
      }
      #touch-joystick-knob::after {
        content: '';
        position: absolute;
        inset: 38%;
        border-radius: 50%;
        background: #c8e4ff;
        box-shadow: 0 0 10px #70b8ff;
      }
      .touch-joystick.active {
        border-color: #69b9ff;
        box-shadow: inset 0 0 28px rgba(76, 157, 255, 0.28), 0 0 24px rgba(50, 144, 255, 0.34);
      }
      .joystick-label {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        color: rgba(221, 238, 255, 0.72);
        font: 800 8px/1 'Segoe UI', sans-serif;
        letter-spacing: 1px;
      }
      #mobile-pause {
        position: absolute;
        top: calc(58px + env(safe-area-inset-top));
        right: calc(12px + env(safe-area-inset-right));
        border-color: rgba(145, 191, 245, 0.78);
        background: rgba(8, 17, 34, 0.82);
      }
      @keyframes tilt {
        0%,
        40% {
          transform: rotate(0deg);
        }
        70%,
        100% {
          transform: rotate(90deg);
        }
      }
      /* Solo en dispositivos tactiles en vertical: el juego es 16:9 horizontal. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
      @media (orientation: landscape) and (pointer: coarse) {
        #fullscreen-button {
          display: block;
        }
        body.gameplay-active #fullscreen-button {
          display: none;
        }
        #mobile-controls.active {
          display: block;
        }
      }
      @media (max-height: 390px) and (orientation: landscape) {
        .touch-cluster {
          bottom: calc(7px + env(safe-area-inset-bottom));
        }
        #mobile-pause {
          top: calc(46px + env(safe-area-inset-top));
        }
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="boot-screen">
      <img id="boot-logo" src="/assets/branding/logo.png" alt="Tito Game" onerror="this.style.display='none'" />
      <div id="boot-title">Tito Game</div>
      <div class="spinner"></div>
      <div id="boot-sub">Cargando aventura...</div>
    </div>
    <div id="rotate-hint">
      <div class="phone"></div>
      <p>Gira tu dispositivo para jugar</p>
      <button id="rotate-fullscreen" type="button">ACTIVAR MODO JUEGO</button>
    </div>
    <button id="fullscreen-button" type="button">PANTALLA COMPLETA</button>
    <div id="mobile-controls" aria-hidden="true">
      <button id="mobile-pause" class="touch-button utility" type="button" aria-label="Pausar y salir">II<small>PAUSA</small></button>
      <div class="touch-cluster move">
        <div id="touch-joystick" class="touch-joystick" role="button" aria-label="Control circular para mover a Tito">
          <span class="joystick-label">MOVER</span>
          <span class="joystick-guide left">&#8249;</span>
          <span class="joystick-guide right">&#8250;</span>
          <span class="joystick-guide down">&#8595;</span>
          <span id="touch-joystick-knob"></span>
        </div>
      </div>
      <div class="touch-cluster actions">
        <button class="touch-button utility" type="button" data-control="rope" aria-label="Usar lazo">Q<small>LAZO</small></button>
        <button class="touch-button utility" type="button" data-control="rock" aria-label="Disparar">B<small>DISPARO</small></button>
        <button class="touch-button primary" type="button" data-control="jump" aria-label="Saltar o volar">A<small>SALTAR / VOLAR</small></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
